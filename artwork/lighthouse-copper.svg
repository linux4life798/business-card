<svg xmlns="http://www.w3.org/2000/svg" width="52mm" height="48mm" viewBox="0 0 52 48">
<title>Lighthouse — F.Cu</title>
<desc>Editable simplified lighthouse artwork for F.Cu; black marks on transparent background. Common 52 x 48 mm canvas; footprint origin/LED center is SVG (34,9) mm. No embedded bitmap or fonts. Minimum stroke 0.35 mm; intentional line junctions are connected. LED clear area is 4 x 2.6 mm centered at (34,9). Copper stays beneath solder mask: do not add F.Mask or F.Paste apertures. Copper requires placement and NFC tuning review.</desc>
